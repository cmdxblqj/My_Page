<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤潮 · 页面过渡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;700;900&display=swap');

  :root {
    --red-bright:  #FF1A1A;
    --red-pure:    #E60000;
    --red-deep:    #990016;
    --red-dark:    #4D000A;
    --red-wine:    #66000D;
    --red-pop:     #FF0033;
    --black:       #0D0D0D;
    --white:       #F8F5F2;
    --cream:       #F0EBE3;
    --bg-page1:    #F2EDE6;
    --bg-page2:    #120C0A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    background: var(--bg-page1);
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ═══════════ PAGE CONTAINERS ═══════════ */
  .page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.2s ease;
    z-index: 1;
  }
  .page.hidden  { opacity: 0; pointer-events: none; }
  .page.active  { opacity: 1; pointer-events: auto; }

  /* ═══════════ PAGE 1 — 赤潮警报 · 波普海报 ═══════════ */
  #page1 {
    background: var(--bg-page1);
    background-image:
      /* Ben-Day dot pattern overlay */
      radial-gradient(circle, rgba(200,30,30,0.06) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  /* Large geometric red shape — background */
  #page1::before {
    content: '';
    position: absolute;
    top: -8%; right: -5%;
    width: 55%; height: 75%;
    background: var(--red-pop);
    clip-path: polygon(30% 0, 100% 0, 100% 100%, 20% 100%, 0 70%, 5% 25%);
    opacity: 0.92;
    pointer-events: none;
  }
  /* Black accent stripe */
  #page1::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 18px; height: 100%;
    background: var(--black);
    pointer-events: none;
  }
  .page1-content {
    position: relative; z-index: 2;
    text-align: left; padding: 0 8vw;
    max-width: 680px; width: 100%;
    margin-top: -30px;
  }
  .page1-content .label-strip {
    display: inline-block;
    background: var(--black);
    color: var(--white);
    font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.22em;
    padding: 6px 18px 4px;
    margin-bottom: 2rem;
  }
  .page1-content h1 {
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 900;
    color: var(--black);
    letter-spacing: 0.04em;
    line-height: 0.9;
    margin-bottom: 0.3rem;
  }
  .page1-content h1 .dot {
    color: var(--red-pure);
    font-size: 1.1em;
  }
  .page1-content .sub-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 3.5vw, 2.8rem);
    letter-spacing: 0.15em;
    color: var(--red-pop);
    margin-bottom: 0.5rem;
  }
  .page1-content .sub-cn {
    font-size: 0.95rem; font-weight: 400;
    color: #444; letter-spacing: 0.18em;
    margin-bottom: 3.5rem;
  }
  .page1-content .sub-cn .slash {
    color: var(--red-pure); font-weight: 900; margin: 0 6px;
  }

  /* Pop Art Button */
  .btn-pop {
    position: relative;
    font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
    font-size: 1.05rem; letter-spacing: 0.18em;
    color: var(--white);
    background: var(--red-pure);
    border: 3px solid var(--black);
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    box-shadow: 6px 6px 0 var(--black);
  }
  .btn-pop:hover {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
    box-shadow: 3px 3px 0 var(--red-pure);
    transform: translate(2px, 2px);
  }
  .btn-pop:active {
    box-shadow: 0 0 0 var(--red-pure);
    transform: translate(6px, 6px);
  }

  /* ═══════════ PAGE 2 — 赤潮之下 · 深红之境 ═══════════ */
  #page2 {
    background: var(--bg-page2);
    background-image:
      radial-gradient(circle, rgba(230,0,0,0.05) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  /* Geometric red accent shapes */
  .geo-shapes {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .geo-shape {
    position: absolute;
    background: var(--red-pop);
    clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
  }
  .geo-shape.g1 { top: 5%; right: 8%; width: 200px; height: 45px; opacity: 0.8; }
  .geo-shape.g2 { top: 16%; right: 12%; width: 80px; height: 30px; opacity: 0.65;
                  clip-path: polygon(0 0, 100% 0, 100% 100%, 15% 100%); }
  .geo-shape.g3 { bottom: 10%; left: 5%; width: 300px; height: 50px; opacity: 0.55;
                  clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%); }
  .geo-shape.g4 { top: 30%; left: 8%; width: 60px; height: 120px; opacity: 0.5;
                  clip-path: polygon(0 0, 100% 15%, 100% 100%, 0 85%); }

  .page2-content {
    position: relative; z-index: 2;
    text-align: center; padding: 0 6vw;
  }
  .page2-content .stamp {
    display: inline-block;
    border: 2.5px solid var(--red-pop);
    color: var(--red-pop);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem; letter-spacing: 0.2em;
    padding: 4px 16px; margin-bottom: 2rem;
  }
  .page2-content h2 {
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 900; color: var(--white);
    letter-spacing: 0.06em; line-height: 1.05;
    margin-bottom: 0.4rem;
  }
  .page2-content h2 .accent {
    color: var(--red-pop);
    text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  }
  .page2-content .desc {
    font-size: 0.95rem; font-weight: 400;
    color: rgba(240,235,225,0.5);
    letter-spacing: 0.14em; margin-bottom: 3.2rem;
    line-height: 1.9; max-width: 440px;
  }
  /* stat blocks */
  .stat-row {
    display: flex; gap: 28px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 3rem;
  }
  .stat-block {
    width: 130px; padding: 18px 10px 14px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(230,0,0,0.25);
    text-align: center;
  }
  .stat-block .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem; color: var(--red-pop);
    letter-spacing: 0.03em; line-height: 1;
  }
  .stat-block .lbl {
    font-size: 0.7rem; color: rgba(240,235,225,0.4);
    letter-spacing: 0.12em; margin-top: 4px;
  }
  #page2 .btn-pop {
    background: transparent;
    color: var(--red-pop);
    border-color: var(--red-pop);
    box-shadow: 6px 6px 0 rgba(230,0,0,0.3);
  }
  #page2 .btn-pop:hover {
    background: var(--red-pop); color: var(--white);
    box-shadow: 3px 3px 0 rgba(255,255,255,0.2);
  }

  /* ═══════════ CANVAS OVERLAY ═══════════ */
  #waterCanvas {
    position: fixed; inset: 0;
    z-index: 100; pointer-events: none;
    width: 100%; height: 100%;
  }
  #waterCanvas.blocking { pointer-events: auto; }

  /* ═══════════ LOADING INDICATOR — Pop Art Style ═══════════ */
  .loading-indicator {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 101;
    display: flex; flex-direction: column;
    align-items: center; gap: 18px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .loading-indicator.visible { opacity: 1; }
  .loading-bar-outer {
    width: 120px; height: 8px;
    border: 2.5px solid #fff;
    background: transparent;
    position: relative; overflow: hidden;
  }
  .loading-bar-inner {
    height: 100%;
    background: #fff;
    animation: bar-fill 0.8s ease-in-out infinite;
  }
  @keyframes bar-fill {
    0%   { width: 0%; margin-left: 0%; }
    50%  { width: 60%; margin-left: 0%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .loading-text {
    font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
    font-size: 0.9rem; letter-spacing: 0.28em;
    color: #fff; text-shadow: 2px 2px 0 #000;
  }

  /* ═══════════ FLOATING ANGULAR SPLASHES ═══════════ */
  .splash-fragment {
    position: fixed; z-index: 102; pointer-events: none;
    background: var(--red-pop);
    clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
    opacity: 0;
    animation: splash-up 0.6s ease-out forwards;
  }
  @keyframes splash-up {
    0%   { opacity: 0.9; transform: translateY(0) scale(1); }
    100% { opacity: 0;   transform: translateY(-80px) scale(0.3); }
  }

  /* ═══════════ KEYBOARD HINT ═══════════ */
  .key-hint {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%); z-index: 5;
    font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.2em;
    color: rgba(0,0,0,0.2); pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #page2 .key-hint { color: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<!-- ═══════════ PAGE 1 — 赤潮警报 ═══════════ -->
<div id="page1" class="page active">
  <div class="page1-content">
    <span class="label-strip">WARNING · 警告</span>
    <p class="sub-en">RED TIDE</p>
    <h1>赤<span class="dot">·</span>潮</h1>
    <p class="sub-cn">深红浪潮<span class="slash">／</span>吞噬一切<span class="slash">／</span>不可逆转</p>
    <button class="btn-pop" onclick="triggerTransition()">▸ 引 发 赤 潮</button>
  </div>
</div>

<!-- ═══════════ PAGE 2 — 赤潮之下 ═══════════ -->
<div id="page2" class="page hidden">
  <div class="geo-shapes">
    <div class="geo-shape g1"></div>
    <div class="geo-shape g2"></div>
    <div class="geo-shape g3"></div>
    <div class="geo-shape g4"></div>
  </div>
  <div class="page2-content">
    <span class="stamp">IMMERSED · 已沉没</span>
    <h2>深<span class="accent">红</span>之境</h2>
    <p class="desc">赤潮已至，万物皆没于深红。<br>这里是波普化的深渊。</p>
    <div class="stat-row">
      <div class="stat-block"><span class="num">100%</span><span class="lbl">饱和度</span></div>
      <div class="stat-block"><span class="num">#FF1A1A</span><span class="lbl">主色号</span></div>
      <div class="stat-block"><span class="num">∞</span><span class="lbl">几何块数</span></div>
    </div>
    <button class="btn-pop" onclick="triggerTransition()">▸ 退 潮 而 去</button>
  </div>
</div>

<!-- ═══════════ WATER CANVAS ═══════════ -->
<canvas id="waterCanvas"></canvas>

<!-- ═══════════ LOADING ═══════════ -->
<div class="loading-indicator" id="loadingIndicator">
  <div class="loading-bar-outer"><div class="loading-bar-inner"></div></div>
  <span class="loading-text">赤 潮 涌 动</span>
</div>

<!-- ═══════════ KEY HINT ═══════════ -->
<div class="key-hint">SPACE 或 点击按钮 触发赤潮</div>

<script>
// ═══════════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('waterCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildBlocks();
}
window.addEventListener('resize', resizeCanvas);

// ═══════════════════════════════════════════
//  COLOR PALETTE — Pop Art Reds (high saturation, flat, no gradient)
// ═══════════════════════════════════════════
const RED_PALETTE = [
  // ═══ darkest depths ═══
  '#1F0004', '#2E0005', '#3D0007', '#4A0009', '#56000C',
  // ═══ deep reds ═══
  '#66000D', '#7A0010', '#8C0012', '#990015', '#A6001A',
  // ═══ mid reds ═══
  '#B8000F', '#CC0011', '#D40018', '#BF0020', '#E61926',
  // ═══ bright reds ═══
  '#E60000', '#FF0A0A', '#FF1A1A', '#FF2D0A', '#FF2200',
  // ═══ dark pinks (暗粉色) ═══
  '#B81440', '#C82D50', '#D43A5C', '#CC2255', '#A81E44',
  // ═══ pop pinks ═══
  '#E6456A', '#FF3366', '#FF4470', '#FF2266', '#D44058',
  // ═══ hot accents ═══
  '#FF0033', '#FF0F28', '#FF0040', '#FF1A3D', '#E82850',
];

// Stripe accent colors (pop contrast slashes)
const STRIPE_REDS = [
  '#FF3366', '#FF4470', '#FF1A1A', '#E60000', '#FF0040',
  '#FF2266', '#D43A5C', '#C82D50',
];

// ═══════════════════════════════════════════
//  TIMING
// ═══════════════════════════════════════════
const RISE_DURATION = 1400;
const FALL_DURATION = 1400;
const MIN_HOLD      = 700;
const SIMULATED_LOAD = 1800;

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let animTime   = 0;
let currentPage = 1;
let transition = null;

// ═══════════════════════════════════════════
//  EASING
// ═══════════════════════════════════════════
function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
}
function easeOutExpo(t) {
  return t >= 1 ? 1 : 1 - Math.pow(2, -10*t);
}

// ═══════════════════════════════════════════
//  WAVE FUNCTIONS — Angular / Sharp / Jagged
// ═══════════════════════════════════════════

/** Standard triangle wave: returns -1..1 */
function triWave(x) {
  const p = Math.abs(2 * ((x / Math.PI) - Math.floor(x / Math.PI + 0.5)));
  return 2 * p - 1;
}

/** Asymmetric sawtooth-like triangle: asymmetry 0.5=symmetric, >0.5=steeper rise */
function sawWave(x, asym) {
  const period = 2 * Math.PI;
  const ph = ((x % period) + period) % period;
  if (ph < asym * period) {
    return 1 - 2 * (ph / (asym * period));
  }
  return -1 + 2 * ((ph - asym * period) / ((1 - asym) * period));
}

/** Composite angular wave surface — sharp peaks, jagged lines */
function computeAngularSurface(x, t) {
  let y = 0;
  y += 42 * triWave(0.0040 * x + t * 0.00032);
  y += 30 * sawWave(0.0075 * x + t * 0.00048, 0.62);
  y += 20 * triWave(0.0120 * x + t * 0.00060);
  y += 14 * sawWave(0.0190 * x + t * 0.00075, 0.40);
  y += 9  * triWave(0.0300 * x + t * 0.00095);
  y += 6  * sawWave(0.0480 * x + t * 0.00110, 0.55);
  return y;
}

// ═══════════════════════════════════════════
//  GEOMETRIC BLOCK SYSTEM
// ═══════════════════════════════════════════
let blocks = [];
let benDayPatterns = [];

function createBenDayPattern(dotColor, bgColor, spacing, dotR) {
  const pc = document.createElement('canvas');
  pc.width = pc.height = spacing;
  const px = pc.getContext('2d');
  px.fillStyle = bgColor;
  px.fillRect(0, 0, spacing, spacing);
  px.fillStyle = dotColor;
  px.beginPath();
  px.arc(spacing/2, spacing/2, dotR, 0, Math.PI*2);
  px.fill();
  return pc;
}

function buildBlocks() {
  // Recreate Ben-Day patterns (including pink-themed)
  benDayPatterns = [
    createBenDayPattern('#000000', '#E60000', 8, 1.5),
    createBenDayPattern('#CC0011', '#FF1A1A', 6, 1.2),
    createBenDayPattern('#66000D', '#CC0011', 10, 2.0),
    createBenDayPattern('#990015', '#FF0033', 7, 1.0),
    createBenDayPattern('#4A0009', '#D43A5C', 9, 1.3),
    createBenDayPattern('#1A0004', '#FF3366', 11, 2.2),
  ];

  blocks = [];
  const rowCount = 22;
  const baseRowH = H / rowCount;

  for (let row = 0; row < rowCount; row++) {
    const rowTop    = row * baseRowH;
    const rowBottom = (row + 1) * baseRowH;
    const rowJitter = baseRowH * 0.72; // larger overlap between rows
    const topY    = rowTop    + (Math.random() - 0.5) * rowJitter;
    const bottomY = rowBottom + (Math.random() - 0.5) * rowJitter;

    const colCount = 5 + Math.floor(Math.random() * 8);
    const colW  = W / colCount;

    for (let c = 0; c < colCount; c++) {
      const leftX  = c * colW;
      const rightX = (c + 1) * colW;
      const jitX = colW * 0.55 + Math.random() * colW * 0.35;

      // 4 corners with aggressive jitter → sharp angles
      const tl = { x: leftX  + (Math.random() - 0.5) * jitX, y: topY    + (Math.random() - 0.5) * rowJitter * 0.7 };
      const tr = { x: rightX + (Math.random() - 0.5) * jitX, y: topY    + (Math.random() - 0.5) * rowJitter * 0.7 };
      const br = { x: rightX + (Math.random() - 0.5) * jitX, y: bottomY + (Math.random() - 0.5) * rowJitter * 0.7 };
      const bl = { x: leftX  + (Math.random() - 0.5) * jitX, y: bottomY + (Math.random() - 0.5) * rowJitter * 0.7 };

      // Color depth distribution with pink zone in upper-middle
      const depthRatio = row / rowCount;
      let palIdx;
      if (depthRatio < 0.18) {
        // Bottom zone: darkest reds (index 0-9)
        palIdx = Math.floor(Math.random() * 10);
      } else if (depthRatio < 0.40) {
        // Lower-mid: deep reds (index 5-14)
        palIdx = 5 + Math.floor(Math.random() * 10);
      } else if (depthRatio < 0.60) {
        // Middle zone: mid reds + dark pinks (index 10-24)
        palIdx = 10 + Math.floor(Math.random() * 15);
      } else if (depthRatio < 0.78) {
        // Upper-middle: dark pinks + pop pinks (index 15-29)
        palIdx = 15 + Math.floor(Math.random() * 15);
      } else {
        // Top zone: bright reds + hot accents (index 14-34)
        palIdx = 14 + Math.floor(Math.random() * 21);
      }
      const color = RED_PALETTE[Math.min(palIdx, RED_PALETTE.length - 1)];

      // Some blocks get Ben-Day pattern (more likely in upper zones)
      const usePattern = Math.random() < (depthRatio > 0.45 ? 0.38 : 0.18);
      const patternIdx = Math.floor(Math.random() * benDayPatterns.length);

      // Some cells become triangles by merging two vertices
      const makeTriangle = Math.random() < 0.22;
      const triVert  = Math.floor(Math.random() * 4);
      let vertices;
      if (makeTriangle) {
        const quad = [tl, tr, br, bl];
        const v0 = quad[triVert];
        const v1 = quad[(triVert + 1) % 4];
        const v2 = quad[(triVert + 2) % 4];
        const v3 = quad[(triVert + 3) % 4];
        // Merge v0 into v1: triangle v1-v2-v3
        if (Math.random() < 0.5) {
          vertices = [{x: (v1.x+v2.x)/2, y: (v1.y+v2.y)/2}, v2, v3];
        } else {
          vertices = [v1, v2, {x: (v2.x+v3.x)/2, y: (v2.y+v3.y)/2}];
        }
      } else {
        vertices = [tl, tr, br, bl];
        // Randomly add a 5th vertex for pentagon shapes
        if (Math.random() < 0.15) {
          const cx = (tl.x + tr.x + br.x + bl.x) / 4 + (Math.random() - 0.5) * colW * 0.5;
          const cy = (tl.y + tr.y + br.y + bl.y) / 4 + (Math.random() - 0.5) * rowJitter;
          // Insert as 3rd vertex
          vertices.splice(2, 0, { x: cx, y: cy });
        }
      }

      // Drift animation
      const seed = Math.random() * Math.PI * 2;
      const driftAmpX = 0.6 + Math.random() * 2.0;
      const driftAmpY = 0.4 + Math.random() * 1.4;
      const driftSpd  = 0.0002 + Math.random() * 0.0005;

      blocks.push({
        vertices,
        color,
        usePattern,
        patternIdx,
        seed,
        driftAmpX, driftAmpY, driftSpd,
      });
    }
  }

  // ── Add diagonal slash overlays (span multiple rows, fill gaps) ──
  const slashCount = Math.floor((W * H) / 42000);
  for (let i = 0; i < slashCount; i++) {
    const sx = Math.random() * W;
    const sy = Math.random() * H;
    const sw = 60 + Math.random() * 200;
    const sh = 8 + Math.random() * 25;
    const angle = (Math.random() - 0.5) * 0.8;
    const cos = Math.cos(angle), sin = Math.sin(angle);

    const verts = [
      { x: sx, y: sy },
      { x: sx + sw * cos, y: sy + sw * sin },
      { x: sx + sw * cos - sh * sin, y: sy + sw * sin + sh * cos },
      { x: sx - sh * sin, y: sy + sh * cos },
    ];

    blocks.push({
      vertices: verts,
      color: STRIPE_REDS[Math.floor(Math.random() * STRIPE_REDS.length)],
      usePattern: false, patternIdx: 0,
      seed: Math.random() * Math.PI * 2,
      driftAmpX: 0.3, driftAmpY: 0.2, driftSpd: 0.0003,
      isSlash: true,
    });
  }
}

// ═══════════════════════════════════════════
//  RENDER PIPELINE
// ═══════════════════════════════════════════

/** Get the surface Y array for the entire canvas width (for clipping) */
function getSurfaceYArray(t, waterLevel) {
  const baseY = H * (1 - waterLevel);

  // Flatten waves as waterLevel approaches 1.0
  const flatStart = 0.88;
  let flatFactor = 1;
  if (waterLevel > flatStart) {
    flatFactor = Math.max(0, 1 - (waterLevel - flatStart) / (1.0 - flatStart));
  }

  // Also slightly reduce when very low (idle bottom strip)
  const idleFactor = waterLevel < 0.06 ? waterLevel / 0.06 : 1;
  const ampScale = flatFactor * idleFactor;

  const arr = new Float32Array(W + 1);
  for (let x = 0; x <= W; x++) {
    arr[x] = baseY + computeAngularSurface(x, t) * ampScale;
  }
  return arr;
}

/** Clip canvas to area BELOW the surface line */
function clipToWater(surfaceY) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(W, H);
  for (let x = W; x >= 0; x--) {
    ctx.lineTo(x, surfaceY[x]);
  }
  ctx.closePath();
  ctx.clip();
}

/** Draw all geometric blocks (assumes clipping is already set) */
function drawBlocks(time) {
  for (const b of blocks) {
    const dx = Math.sin(time * 0.001 * b.driftSpd * 1000 + b.seed) * b.driftAmpX;
    const dy = Math.cos(time * 0.001 * b.driftSpd * 800 + b.seed + 1.3) * b.driftAmpY;

    // Build path
    ctx.beginPath();
    const v0 = b.vertices[0];
    ctx.moveTo(v0.x + dx, v0.y + dy);
    for (let i = 1; i < b.vertices.length; i++) {
      ctx.lineTo(b.vertices[i].x + dx, b.vertices[i].y + dy);
    }
    ctx.closePath();

    // Fill
    if (b.usePattern && benDayPatterns[b.patternIdx]) {
      const pat = ctx.createPattern(benDayPatterns[b.patternIdx], 'repeat');
      ctx.fillStyle = pat;
    } else {
      ctx.fillStyle = b.color;
    }
    ctx.fill();

    // Stroke — thick black outline
    ctx.strokeStyle = '#0D0D0D';
    ctx.lineWidth = b.isSlash ? 1.6 : 2.2;
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 4;
    ctx.stroke();
  }
}

/** Draw the surface contour line */
function drawSurfaceLine(surfaceY) {
  // Main thick black contour
  ctx.beginPath();
  ctx.moveTo(0, surfaceY[0]);
  for (let x = 1; x <= W; x++) {
    ctx.lineTo(x, surfaceY[x]);
  }
  ctx.strokeStyle = '#0D0D0D';
  ctx.lineWidth = 4.5;
  ctx.lineJoin = 'miter';
  ctx.miterLimit = 5;
  ctx.stroke();

  // White highlight line just above (pop art separation)
  ctx.beginPath();
  ctx.moveTo(0, surfaceY[0] - 5);
  for (let x = 1; x <= W; x++) {
    ctx.lineTo(x, surfaceY[x] - 5);
  }
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1.8;
  ctx.stroke();
}

/** Draw Ben-Day dot overlay across the water surface band */
function drawSurfaceDots(surfaceY) {
  if (benDayPatterns.length === 0) return;

  // Manual min/max on Float32Array (safer than spread)
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < surfaceY.length; i++) {
    if (surfaceY[i] < minY) minY = surfaceY[i];
    if (surfaceY[i] > maxY) maxY = surfaceY[i];
  }
  const bandTop = Math.max(0, minY - 10);
  const bandH   = Math.min(H - bandTop, maxY - minY + 40);

  if (bandH <= 0) return;

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  ctx.rect(0, bandTop, W, bandH);
  ctx.clip();

  const pat = ctx.createPattern(benDayPatterns[0], 'repeat');
  ctx.fillStyle = pat;
  ctx.fillRect(0, bandTop, W, bandH);
  ctx.restore();
}

/** Main render function */
function render(t, waterLevel) {
  ctx.clearRect(0, 0, W, H);
  if (waterLevel <= 0.003) return;

  const surfaceY = getSurfaceYArray(t, waterLevel);

  ctx.save();
  clipToWater(surfaceY);

  // ═══ SOLID BASE FILL — ensures ZERO transparency, fully obscures page ═══
  ctx.fillStyle = '#140003';
  ctx.fillRect(0, 0, W, H);

  drawBlocks(t);
  ctx.restore();

  // Only draw surface line if waves haven't fully flattened
  const flatStart = 0.88;
  const flatFactor = waterLevel > flatStart ? Math.max(0, 1 - (waterLevel - flatStart) / (1.0 - flatStart)) : 1;
  if (flatFactor > 0.02) {
    drawSurfaceLine(surfaceY);
    drawSurfaceDots(surfaceY);
  }

  // ── White angular splash fragments near surface peaks ──
  if (waterLevel > 0.06 && waterLevel < 0.96) {
    const step = 25;
    for (let x = 0; x <= W; x += step) {
      const y = surfaceY[x];
      // Check if this is a local peak
      const prevY = x >= step ? surfaceY[x - step] : y;
      const nextY = x + step <= W ? surfaceY[x + step] : y;
      if (y < prevY - 8 && y < nextY - 8 && Math.random() < 0.25) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        const s = 3 + Math.random() * 5;
        ctx.moveTo(x, y);
        ctx.lineTo(x - s*0.4, y - s);
        ctx.lineTo(x + s*0.4, y - s*0.6);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

// ═══════════════════════════════════════════
//  TRANSITION LOGIC
// ═══════════════════════════════════════════
function triggerTransition() {
  if (transition) return;
  transition = {
    phase: 'rising',
    startTime: performance.now(),
    holdStart: 0,
    loaded: false,
    waterLevel: 0,
  };
  canvas.classList.add('blocking');

  setTimeout(() => {
    if (transition) transition.loaded = true;
  }, SIMULATED_LOAD);
}

function updateTransition(now) {
  if (!transition) return;
  const elapsed = now - transition.startTime;

  if (transition.phase === 'rising') {
    const t = Math.min(elapsed / RISE_DURATION, 1);
    transition.waterLevel = easeInOutCubic(t);
    if (t >= 1) {
      transition.phase = 'holding';
      transition.holdStart = now;
      swapPages();
      document.getElementById('loadingIndicator').classList.add('visible');
    }
  }

  if (transition.phase === 'holding') {
    transition.waterLevel = 1;
    if (transition.loaded && (now - transition.holdStart) >= MIN_HOLD) {
      transition.phase = 'falling';
      transition.startTime = now;
      document.getElementById('loadingIndicator').classList.remove('visible');
    }
  }

  if (transition.phase === 'falling') {
    const t = Math.min((now - transition.startTime) / FALL_DURATION, 1);
    transition.waterLevel = 1 - easeOutExpo(t);
    if (t >= 1) {
      transition.waterLevel = 0;
      transition = null;
      canvas.classList.remove('blocking');
    }
  }
}

function swapPages() {
  const p1 = document.getElementById('page1');
  const p2 = document.getElementById('page2');
  if (currentPage === 1) {
    p1.classList.remove('active'); p1.classList.add('hidden');
    p2.classList.remove('hidden'); p2.classList.add('active');
    currentPage = 2;
    document.querySelector('.loading-text').textContent = '赤 潮 退 去';
  } else {
    p2.classList.remove('active'); p2.classList.add('hidden');
    p1.classList.remove('hidden'); p1.classList.add('active');
    currentPage = 1;
    document.querySelector('.loading-text').textContent = '赤 潮 涌 动';
  }
}

// ═══════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════
let lastTime = performance.now();

function animate(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  animTime += dt;

  updateTransition(ts);
  const wl = transition ? transition.waterLevel : 0.035;

  render(animTime, wl);

  // Update loading indicator visibility & position
  const indicator = document.getElementById('loadingIndicator');
  if (transition && transition.phase === 'holding') {
    indicator.style.top = '42%';
  }

  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    triggerTransition();
  }
});

// ═══════════════════════════════════════════
//  START
// ═══════════════════════════════════════════
resizeCanvas();
requestAnimationFrame(animate);

console.log('%c🔴 赤潮 · RED TIDE %c— 现代波普艺术水体剖面',
  'font-size:1.15em;font-weight:bold;color:#E60000;', 'color:#666;');
console.log('%c   升起 ' + RISE_DURATION + 'ms | 停留 ≥' + MIN_HOLD + 'ms | 下落 ' + FALL_DURATION + 'ms | 加载模拟 ' + SIMULATED_LOAD + 'ms',
  'color:#888;font-size:0.85em;');
</script>
