<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdant Codex · 翠玉文庫</title>

  <!-- Fonts: Bebas Neue for P5 headlines + DM Sans body + Fredoka accent + Noto Sans SC CJK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Verdant Green palette
       ═══════════════════════════════════════════ */
    :root {
      /* Deep backgrounds */
      --bg-deep: #040a05;
      --bg-card: #030d04;
      --bg-reader: #050e07;

      /* Verdant Green family — rich emerald to electric lime */
      --green-primary: #00B830;
      --green-bright: #00D840;
      --green-neon: #30FF30;
      --green-electric: #50FF50;
      --green-royal: #0A9A2E;
      --green-crimson: #0D7020;
      --green-steel: #1A4018;
      --green-deep: #0E2A0A;

      /* Lime / chartreuse accents */
      --lime-bright: #80FF40;
      --lime-muted: #7CBA5C;
      --lime-soft: #B0E8A0;

      /* Gold — contrast accent (stars, diamonds, highlights) */
      --gold: #FFD700;
      --gold-bright: #FFE850;
      --gold-pale: #FFF2A0;

      /* Neutrals */
      --white-soft: #e8f4ea;
      --white-warm: #f0f8f2;
      --black-pure: #000000;
      --black-soft: #0a0e0a;

      /* Fonts */
      --font-display: 'Bebas Neue', 'Noto Sans SC', sans-serif;
      --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
      --font-accent: 'Fredoka', cursive;
      --font-mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-deep);
      color: var(--white-soft);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ═══════════════════════════════════════════
       BACKGROUND LAYERS
       ═══════════════════════════════════════════ */

    /* Layer 0: Deep green-black radial base */
    .bg-base {
      position: fixed; inset: 0; z-index: -3;
      background: radial-gradient(ellipse at 50% 30%, #0a1a08 0%, #040a05 60%, #000000 100%);
    }

    /* Layer 1: Polka dot pattern — pop art classic in green */
    .bg-polkadot {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      --dot-size: 3px;
      --dot-spacing: 28px;
      background-image:
        radial-gradient(circle at center, rgba(0, 200, 48, 0.20) var(--dot-size), transparent var(--dot-size));
      background-size: var(--dot-spacing) var(--dot-spacing);
      animation: polkaDrift 30s linear infinite;
    }

    /* Layer 2: Larger accent dots — varied green tones */
    .bg-polkadot-large {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      --dot-size: 6px;
      --dot-spacing: 90px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(48, 255, 48, 0.24) var(--dot-size), transparent var(--dot-size)),
        radial-gradient(circle at 70% 60%, rgba(128, 255, 64, 0.18) var(--dot-size), transparent var(--dot-size)),
        radial-gradient(circle at 40% 80%, rgba(10, 154, 46, 0.26) var(--dot-size), transparent var(--dot-size));
      background-size: var(--dot-spacing) var(--dot-spacing), var(--dot-spacing) var(--dot-spacing), var(--dot-spacing) var(--dot-spacing);
      animation: polkaDriftLarge 45s linear infinite reverse;
    }

    /* Layer 3: Halftone gradient strips — Ben-Day dots vibe in green */
    .bg-halftone {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(48, 255, 48, 0.04) 3px,
          rgba(48, 255, 48, 0.04) 6px
        );
      mask-image: radial-gradient(ellipse at 50% 50%, transparent 30%, black 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 30%, black 80%);
    }

    /* Layer 4: Action lines at edges */
    .bg-action-lines {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        conic-gradient(from 45deg at 5% 95%, transparent 0deg, rgba(0, 200, 48, 0.03) 10deg, transparent 20deg, transparent 360deg),
        conic-gradient(from -135deg at 95% 5%, transparent 0deg, rgba(80, 255, 80, 0.03) 10deg, transparent 20deg, transparent 360deg);
    }

    /* ═══════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════ */
    @keyframes polkaDrift {
      0%   { background-position: 0 0; }
      100% { background-position: var(--dot-spacing) var(--dot-spacing); }
    }
    @keyframes polkaDriftLarge {
      0%   { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: calc(var(--dot-spacing) * 2) var(--dot-spacing), calc(var(--dot-spacing) * -1) calc(var(--dot-spacing) * 2), var(--dot-spacing) calc(var(--dot-spacing) * -1); }
    }

    @keyframes panelReveal {
      0%   { opacity: 0; transform: translateY(30px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes diamondSpin {
      0%   { transform: rotate(0deg) scale(0); opacity: 0; }
      60%  { transform: rotate(50deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(45deg) scale(1); opacity: 1; }
    }

    @keyframes burstPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      70%  { transform: scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes slashIn {
      0%   { width: 0; opacity: 0; }
      100% { width: 100%; opacity: 1; }
    }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 200, 48, 0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(0, 200, 48, 0); }
    }

    @keyframes dripDown {
      0%   { height: 0; opacity: 0; }
      100% { height: 55px; opacity: 0.7; }
    }

    @keyframes starSpin {
      0%   { transform: rotate(0deg) scale(0.8); opacity: 0.3; }
      50%  { transform: rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.3; }
    }

    @keyframes readerSlideIn {
      0%   { opacity: 0; transform: translateX(60px) scale(0.95); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes borderGlowGreen {
      0%, 100% { border-color: var(--green-bright); box-shadow: 0 0 8px rgba(0, 200, 48, 0.3), inset 0 0 8px rgba(0, 200, 48, 0.05); }
      50%      { border-color: var(--green-neon); box-shadow: 0 0 20px rgba(48, 255, 48, 0.5), inset 0 0 16px rgba(48, 255, 48, 0.1); }
    }

    @keyframes textGlitchGreen {
      0%, 100% { text-shadow: 3px 3px 0 var(--green-bright), -3px -3px 0 var(--lime-bright); }
      25%       { text-shadow: -3px 3px 0 var(--green-neon), 3px -3px 0 var(--green-royal); }
      50%       { text-shadow: 3px -3px 0 var(--lime-bright), -3px 3px 0 var(--green-crimson); }
      75%       { text-shadow: -3px -3px 0 var(--green-electric), 3px 3px 0 var(--lime-muted); }
    }

    @keyframes slideFromRight {
      0%   { transform: translateX(40px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes pageRipple {
      0%   { transform: scale(0); opacity: 0.6; }
      100% { transform: scale(4); opacity: 0; }
    }

    /* ═══════════════════════════════════════════
       P5 DECORATIVE DIAMONDS (green + gold)
       ═══════════════════════════════════════════ */
    .p5-diamond {
      width: 12px; height: 12px;
      background: var(--green-bright);
      transform: rotate(45deg);
      display: inline-block;
      flex-shrink: 0;
      animation: diamondSpin 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    .p5-diamond.small { width: 8px; height: 8px; }
    .p5-diamond.gold { background: var(--gold); }
    .p5-diamond.lime { background: var(--lime-bright); }

    /* ═══════════════════════════════════════════
       CORNER DECORATIONS
       ═══════════════════════════════════════════ */
    .corner-deco {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      opacity: 0.55;
    }
    .corner-deco.tl { top: 20px; left: 20px; }
    .corner-deco.tr { top: 20px; right: 20px; }
    .corner-deco.bl { bottom: 20px; left: 20px; }
    .corner-deco.br { bottom: 20px; right: 20px; }

    .corner-angle {
      width: 40px; height: 40px;
      border: 3px solid var(--green-crimson);
      position: relative;
    }
    .corner-angle.tl-shape {
      border-right: none; border-bottom: none;
      animation: panelReveal 0.8s ease 0.8s forwards;
      opacity: 0;
    }
    .corner-angle.br-shape {
      border-left: none; border-top: none;
      animation: panelReveal 0.8s ease 1s forwards;
      opacity: 0;
    }
    .corner-angle.tr-shape {
      border-left: none; border-bottom: none;
      animation: panelReveal 0.8s ease 0.9s forwards;
      opacity: 0;
    }
    .corner-angle.bl-shape {
      border-right: none; border-top: none;
      animation: panelReveal 0.8s ease 1.1s forwards;
      opacity: 0;
    }

    /* ═══════════════════════════════════════════
       GREEN DRIP DECORATION (like reference drip)
       ═══════════════════════════════════════════ */
    .drip-container {
      position: fixed;
      top: 0;
      right: 60px;
      z-index: 5;
      pointer-events: none;
    }
    .drip {
      width: 3px;
      background: linear-gradient(to bottom, var(--green-bright), var(--lime-bright));
      border-radius: 0 0 3px 3px;
      margin-bottom: 12px;
      animation: dripDown 2s ease-out forwards;
      opacity: 0;
    }
    .drip:nth-child(1) { animation-delay: 1.2s; height: 40px; }
    .drip:nth-child(2) { animation-delay: 1.5s; height: 25px; margin-left: 8px; }
    .drip:nth-child(3) { animation-delay: 1.8s; height: 50px; margin-left: -4px; }
    .drip:nth-child(4) { animation-delay: 2.0s; height: 30px; margin-left: 6px; }

    /* ═══════════════════════════════════════════
       MAIN APP LAYOUT
       ═══════════════════════════════════════════ */
    .app-layout {
      display: flex;
      gap: 0rem;
      padding: 1.5rem;
      min-height: 100vh;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .app-layout.reader-open {
      align-items: flex-start;
    }

    /* ── Left spacer: pushes content center initially, collapses on open ── */
    .layout-spacer {
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-layout:not(.reader-open) .layout-spacer {
      flex: 1;
    }
    .app-layout.reader-open .layout-spacer {
      flex: 0;
    }

    /* ── Right spacer ── */
    .layout-spacer-right {
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-layout:not(.reader-open) .layout-spacer-right {
      flex: 1;
    }
    .app-layout.reader-open .layout-spacer-right {
      flex: 0;
    }

    /* ── Article list panel ── */
    .article-panel {
      width: 620px;
      max-width: 92vw;
      flex-shrink: 0;
      transition: width 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                  margin 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .app-layout.reader-open .article-panel {
      width: 380px;
      margin-right: 1.5rem;
    }

    /* ── Narrow panel: compact button internals ── */
    .app-layout.reader-open .article-btn {
      padding: 1rem 1.2rem;
    }
    .app-layout.reader-open .article-btn .art-cover-icon {
      width: 40px; height: 40px;
      font-size: 1.2rem;
    }
    .app-layout.reader-open .article-btn .art-title {
      font-size: 1.15rem;
    }
    .app-layout.reader-open .article-btn .art-excerpt {
      font-size: 0.78rem;
    }
    .app-layout.reader-open .article-btn .art-meta {
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .app-layout.reader-open .article-btn .art-date,
    .app-layout.reader-open .article-btn .art-time {
      font-size: 0.7rem;
    }
    .app-layout.reader-open .article-btn .art-tag {
      font-size: 0.65rem;
    }

    /* ── Reader panel ── */
    .reader-panel {
      flex: 0;
      width: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateX(50px);
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s,
                  transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
      max-height: calc(100vh - 3rem);
      position: sticky;
      top: 1.5rem;
    }
    .app-layout.reader-open .reader-panel {
      flex: 1;
      width: auto;
      opacity: 1;
      transform: translateX(0);
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       COMIC PANEL — adapted for green P5 aesthetic
       ═══════════════════════════════════════════ */
    .comic-panel {
      background: var(--bg-card);
      border: 3px solid var(--black-pure);
      outline: 1.5px solid var(--green-crimson);
      outline-offset: -6px;
      padding: 2rem 1.8rem;
      position: relative;
      box-shadow:
        8px 8px 0 rgba(0,0,0,0.9),
        14px 14px 0 rgba(0, 200, 48, 0.10);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .comic-panel:hover {
      transform: translate(-2px, -2px);
      box-shadow:
        10px 10px 0 rgba(0,0,0,0.9),
        18px 18px 0 rgba(0, 200, 48, 0.18);
    }

    /* Inner halftone strip at top of comic panels */
    .comic-panel::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        var(--green-bright) 0px,
        var(--green-bright) 4px,
        transparent 4px,
        transparent 8px
      );
      opacity: 0.45;
    }

    /* ═══════════════════════════════════════════
       HEADER — Archive title
       ═══════════════════════════════════════════ */
    .archive-header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }
    .archive-label {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: panelReveal 0.6s ease 0.1s forwards;
    }
    .archive-label .p5-diamond {
      animation-delay: 0.3s;
    }

    .archive-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 400;
      line-height: 0.9;
      color: var(--white-soft);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: panelReveal 0.7s ease 0.25s forwards;
    }
    .archive-title .title-accent {
      color: var(--green-bright);
      position: relative;
      display: inline-block;
    }
    .archive-title .title-accent::after {
      content: '✦';
      position: absolute;
      top: -0.4em;
      right: -0.3em;
      font-size: 0.3em;
      color: var(--gold-bright);
      animation: floatUpDown 2s ease-in-out infinite;
    }

    .archive-subtitle {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--lime-muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 0.2rem;
      opacity: 0;
      animation: panelReveal 0.6s ease 0.4s forwards;
    }

    /* Green slash divider */
    .header-slash {
      width: 0;
      height: 4px;
      background: var(--green-bright);
      margin: 1.2rem auto;
      position: relative;
      animation: slashIn 1s ease 0.6s forwards;
    }
    .header-slash::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 0; right: 0;
      height: 12px;
      background: repeating-linear-gradient(
        90deg,
        var(--green-crimson) 0px,
        var(--green-crimson) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* ═══════════════════════════════════════════
       ARTICLE BUTTONS — comic panel cards
       ═══════════════════════════════════════════ */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .article-btn {
      display: block;
      width: 100%;
      background: var(--bg-card);
      border: 3px solid var(--black-pure);
      outline: 1.5px solid var(--green-steel);
      outline-offset: -6px;
      padding: 1.3rem 1.5rem;
      position: relative;
      cursor: pointer;
      text-align: left;
      color: var(--white-soft);
      font-family: var(--font-body);
      box-shadow:
        6px 6px 0 rgba(0,0,0,0.85),
        10px 10px 0 rgba(0, 200, 48, 0.06);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }
    .article-btn::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--green-bright) 0px,
        var(--green-bright) 3px,
        transparent 3px,
        transparent 6px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .article-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow:
        10px 10px 0 rgba(0,0,0,0.9),
        16px 16px 0 rgba(0, 200, 48, 0.14);
      outline-color: var(--green-bright);
      border-color: var(--green-bright);
    }
    .article-btn:hover::before {
      opacity: 0.6;
    }
    .article-btn:active {
      transform: translate(-1px, -1px);
      box-shadow:
        4px 4px 0 rgba(0,0,0,0.85),
        8px 8px 0 rgba(0, 200, 48, 0.08);
    }

    /* Selected state */
    .article-btn.active {
      outline-color: var(--green-neon);
      outline-width: 2px;
      border-color: var(--green-neon);
      animation: borderGlowGreen 2.5s ease-in-out infinite;
      box-shadow:
        6px 6px 0 rgba(0,0,0,0.9),
        10px 10px 0 rgba(48, 255, 48, 0.18);
    }
    .article-btn.active::before {
      opacity: 0.7;
      background: repeating-linear-gradient(
        90deg,
        var(--green-neon) 0px,
        var(--green-neon) 3px,
        transparent 3px,
        transparent 6px
      );
    }

    /* Article button inner layout */
    .article-btn .art-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .article-btn .art-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--lime-muted);
      letter-spacing: 0.06em;
      background: rgba(0, 200, 48, 0.10);
      padding: 0.15em 0.6em;
      border-radius: 3px;
    }
    .article-btn .art-time {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--gold);
      letter-spacing: 0.04em;
    }
    .article-btn .art-tag {
      font-family: var(--font-accent);
      font-size: 0.7rem;
      color: var(--lime-soft);
      background: rgba(128, 255, 64, 0.08);
      padding: 0.15em 0.55em;
      border-radius: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .article-btn .art-cover-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .article-btn .art-cover-icon {
      width: 52px; height: 52px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--green-deep), var(--green-steel));
      border: 2px solid var(--green-crimson);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transform: rotate(0deg);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .article-btn:hover .art-cover-icon {
      transform: rotate(-3deg) scale(1.05);
      border-color: var(--green-bright);
    }
    .article-btn .art-cover-icon::after {
      content: '';
      position: absolute;
      bottom: 3px; right: 3px;
      width: 12px; height: 12px;
      background: radial-gradient(circle, var(--green-bright) 2px, transparent 2px);
      background-size: 6px 6px;
      opacity: 0.5;
    }

    .article-btn .art-info {

### 最初の標的

最初の標的は、学校で権力を振るかざす**体育教師**。彼のパレスは中世の城塞として具現化していた。

\`\`\`

| メンバー | コードネーム | 初期ペルソナ | 属性 |

     ═══════════════════════════════════════════════════════════ */
  async function discoverMarkdownFiles() {
    const discovered = [];
    // Common .md filenames to probe (browser can't list directories)
    const candidates = [
      'readme.md', 'README.md', 'index.md', 'INDEX.md',
      'notes.md', 'article.md', 'doc.md', 'guide.md',
      'resource.md', 'tutorial.md', 'manual.md', 'wiki.md',
      'log.md', 'journal.md', 'report.md', 'summary.md',
      '参考.md', '笔记.md', '文档.md', '说明.md', '资源.md',
    ];

    const fetchPromises = candidates.map(async (filename) => {
      try {
        const resp = await fetch(filename, { method: 'HEAD' });
        if (resp.ok) {
          return filename;
        }
      } catch (e) {
        // file doesn't exist or can't be accessed
      }
      return null;
    });

    const results = await Promise.all(fetchPromises);
    const found = results.filter(Boolean);

    // For each found file, fetch its content
    for (const filename of found) {
      try {
        const resp = await fetch(filename);
        const text = await resp.text();
        const name = filename.replace(/\.md$/i, '');
        discovered.push({
          id: 'ext-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          title: name.replace(/[-_]/g, ' '),
          date: '----.--.--',
          time: '--:--',
          cover: '📄',
          tags: ['外部'],
          excerpt: 'External markdown file: ' + filename,
          content: text,
          isExternal: true,
          sourceFile: filename,
        });
      } catch (e) {
        console.warn(`[VerdantCodex] Could not read ${filename}:`, e.message);
      }
    }

    return discovered;

    setTimeout(() => {
      const mdContent = document.getElementById('mdContent');
      const readerHeader = document.getElementById('readerHeader');
      mdContent.innerHTML = `
        <div class="reader-empty">
          <div class="empty-diamond"></div>
          <p class="empty-text">Select a codex entry<br>to begin reading</p>
        </div>
      `;
      readerHeader.style.display = 'none';
      updateScrollEffects();
    }, 600);
  }

  /* ═══════════════════════════════════════════════════════════
     RENDER MARKDOWN CONTENT IN READER
     ═══════════════════════════════════════════════════════════ */
  function renderReaderContent(article, id) {
    const mdContent = document.getElementById('mdContent');
    const readerHeader = document.getElementById('readerHeader');
    const rhDate = document.getElementById('rhDate');
    const rhTag = document.getElementById('rhTag');
    const rhTitle = document.getElementById('rhTitle');

    // Update header
    rhDate.textContent = `${article.date} · ${article.time}`;
    rhTag.textContent = article.tags.map(t => `#${t}`).join(' ');
    rhTitle.textContent = article.title;
    readerHeader.style.display = 'block';

    // Render markdown
    let html;
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true,
      });
      html = marked.parse(article.content);
    } else {
      html = article.content
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
      html = `<p>${html}</p>`;
    }

    mdContent.innerHTML = html;
    mdContent.classList.remove('reader-open-anim');
    void mdContent.offsetWidth; // Force reflow
    mdContent.classList.add('reader-open-anim');
    mdContent.style.opacity = '1';
  }

  /* ═══════════════════════════════════════════════════════════
     SCROLL-DRIVEN FADE IN/OUT
     ═══════════════════════════════════════════════════════════ */
  function updateScrollEffects() {
    const vh = window.innerHeight;
    if (state.isReaderOpen || !state.entranceComplete) return;

    const buttons = document.querySelectorAll('.article-btn');
    buttons.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const center = (rect.top + rect.bottom) / 2;
      const ratio = center / vh;

      let opacity;
      if (ratio < 0.2) {
        opacity = 0;
      } else if (ratio < 0.35) {
        opacity = (ratio - 0.2) / 0.15;
      } else if (ratio < 0.65) {
        opacity = 1;
      } else if (ratio < 0.8) {
        opacity = 1 - (ratio - 0.65) / 0.15;
      } else {
        opacity = 0;
      }
      opacity = Math.max(0, Math.min(1, opacity));

      const translateY = (1 - opacity) * 40;
      const scale = 0.93 + opacity * 0.07;

      btn.style.opacity = opacity;
      btn.style.transform = `translateY(${translateY}px) scale(${scale})`;
    });
    state.scrollTicking = false;
  }

  function onScroll() {
    if (!state.scrollTicking) {
      requestAnimationFrame(updateScrollEffects);
      state.scrollTicking = true;
    }
  }

  function initScrollAnimations() {
    setTimeout(() => {
      state.entranceComplete = true;
      document.querySelectorAll('.article-btn').forEach(btn => {
        btn.style.animation = 'none';
        btn.style.opacity = '1';
        btn.style.transform = 'none';
      });
      if (!state.isReaderOpen) {
        updateScrollEffects();
      }
    }, 2000);

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
  }

  /* ═══════════════════════════════════════════════════════════
     CLICK SPARKLE EFFECT (green version)
     ═══════════════════════════════════════════════════════════ */
  function initSparkleEffect() {
    document.addEventListener('click', function(e) {
      const spark = document.createElement('div');
      const size = Math.random() * 8 + 4;
      // Alternate between green and gold sparkles
      const hue = Math.random() > 0.4
        ? '48, 255, 48'   // neon green
        : '255, 215, 0';  // gold
      spark.style.cssText = `
        position: fixed;
        left: ${e.clientX - size/2}px;
        top: ${e.clientY - size/2}px;
        width: ${size}px;
        height: ${size}px;
        background: radial-gradient(circle, rgba(${hue}, 0.9), rgba(${hue}, 0.3));
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
        animation: sparkFade 0.6s ease-out forwards;
      `;
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    });

    const sparkStyle = document.createElement('style');
    sparkStyle.textContent = `
      @keyframes sparkFade {
        0%   { transform: scale(1); opacity: 1; }
        100% { transform: scale(3); opacity: 0; }
      }
    `;
    document.head.appendChild(sparkStyle);
  }

  /* ═══════════════════════════════════════════════════════════
     KEYBOARD SHORTCUTS
     ═══════════════════════════════════════════════════════════ */
  function initKeyboardShortcuts() {
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && state.isReaderOpen) {
        closeReader();
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════
     INITIALIZATION
     ═══════════════════════════════════════════════════════════ */
  async function init() {
    state.articles = await fetchAllArticles();
    renderArticleButtons(state.articles);

    document.getElementById('readerBack').addEventListener('click', closeReader);

    initScrollAnimations();
    initSparkleEffect();
    initKeyboardShortcuts();

    if (externalArticles.length > 0) {
      console.log(
        `%c◆ Verdant Codex ◆%c\nLoaded %c${externalArticles.length}%c external .md file(s): %c${externalArticles.map(a => a.sourceFile).join(', ')}`,
        'color: #00D840; font-family: "Bebas Neue", sans-serif; font-size: 1.2em;',
        '', 'color: #FFD700;', '', 'color: #80FF40;'
      );
    }
  }

  init().catch(console.error);
  </script>
