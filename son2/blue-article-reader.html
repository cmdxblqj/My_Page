<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom Archive · 怪盗文庫</title>

  <!-- Fonts: Bebas Neue for P5 headlines + DM Sans body + Fredoka accent + Noto Sans SC CJK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Klein Blue palette
       ═══════════════════════════════════════════ */
    :root {
      /* Deep backgrounds */
      --bg-deep: #060a16;
      --bg-card: #040810;
      --bg-reader: #070b1a;

      /* Klein Blue family — the signature intense ultramarine */
      --blue-klein: #002FA7;
      --blue-bright: #0047E0;
      --blue-neon: #2962ff;
      --blue-electric: #3b6eff;
      --blue-royal: #1a3fcf;
      --blue-crimson: #1030a8;
      --blue-steel: #1a2b6b;
      --blue-deep: #10184a;

      /* Sky blue accents */
      --sky-bright: #5b9eff;
      --sky-muted: #7baee4;
      --sky-soft: #b8d4f0;

      /* Gold — contrast accent (stars, diamonds) */
      --gold: #ffc107;
      --gold-bright: #ffd54f;
      --gold-pale: #ffe69c;

      /* Neutrals */
      --white-soft: #e8ecf4;
      --white-warm: #f0f2f8;
      --black-pure: #000000;
      --black-soft: #0a0c18;

      /* Fonts */
      --font-display: 'Bebas Neue', 'Noto Sans SC', sans-serif;
      --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
      --font-accent: 'Fredoka', cursive;
      --font-mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-deep);
      color: var(--white-soft);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ═══════════════════════════════════════════
       BACKGROUND LAYERS
       ═══════════════════════════════════════════ */

    /* Layer 0: Deep navy-black radial base */
    .bg-base {
      position: fixed; inset: 0; z-index: -3;
      background: radial-gradient(ellipse at 50% 30%, #0d1528 0%, #060a16 60%, #000000 100%);
    }

    /* Layer 1: Polka dot pattern — pop art classic in blue */
    .bg-polkadot {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      --dot-size: 3px;
      --dot-spacing: 28px;
      background-image:
        radial-gradient(circle at center, rgba(0, 71, 224, 0.22) var(--dot-size), transparent var(--dot-size));
      background-size: var(--dot-spacing) var(--dot-spacing);
      animation: polkaDrift 30s linear infinite;
    }

    /* Layer 2: Larger accent dots — varied blue tones */
    .bg-polkadot-large {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      --dot-size: 6px;
      --dot-spacing: 90px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(41, 98, 255, 0.28) var(--dot-size), transparent var(--dot-size)),
        radial-gradient(circle at 70% 60%, rgba(91, 158, 255, 0.22) var(--dot-size), transparent var(--dot-size)),
        radial-gradient(circle at 40% 80%, rgba(26, 43, 107, 0.28) var(--dot-size), transparent var(--dot-size));
      background-size: var(--dot-spacing) var(--dot-spacing), var(--dot-spacing) var(--dot-spacing), var(--dot-spacing) var(--dot-spacing);
      animation: polkaDriftLarge 45s linear infinite reverse;
    }

    /* Layer 3: Halftone gradient strips — Ben-Day dots vibe in blue */
    .bg-halftone {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(41, 98, 255, 0.05) 3px,
          rgba(41, 98, 255, 0.05) 6px
        );
      mask-image: radial-gradient(ellipse at 50% 50%, transparent 30%, black 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 30%, black 80%);
    }

    /* Layer 4: Action lines at edges */
    .bg-action-lines {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        conic-gradient(from 45deg at 5% 95%, transparent 0deg, rgba(0, 71, 224, 0.035) 10deg, transparent 20deg, transparent 360deg),
        conic-gradient(from -135deg at 95% 5%, transparent 0deg, rgba(41, 98, 255, 0.035) 10deg, transparent 20deg, transparent 360deg);
    }

    /* ═══════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════ */
    @keyframes polkaDrift {
      0%   { background-position: 0 0; }
      100% { background-position: var(--dot-spacing) var(--dot-spacing); }
    }
    @keyframes polkaDriftLarge {
      0%   { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: calc(var(--dot-spacing) * 2) var(--dot-spacing), calc(var(--dot-spacing) * -1) calc(var(--dot-spacing) * 2), var(--dot-spacing) calc(var(--dot-spacing) * -1); }
    }

    @keyframes panelReveal {
      0%   { opacity: 0; transform: translateY(30px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes diamondSpin {
      0%   { transform: rotate(0deg) scale(0); opacity: 0; }
      60%  { transform: rotate(50deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(45deg) scale(1); opacity: 1; }
    }

    @keyframes burstPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      70%  { transform: scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes slashIn {
      0%   { width: 0; opacity: 0; }
      100% { width: 100%; opacity: 1; }
    }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes pulseBlue {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 71, 224, 0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(0, 71, 224, 0); }
    }

    @keyframes dripDown {
      0%   { height: 0; opacity: 0; }
      100% { height: 55px; opacity: 0.7; }
    }

    @keyframes starSpin {
      0%   { transform: rotate(0deg) scale(0.8); opacity: 0.3; }
      50%  { transform: rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.8); opacity: 0.3; }
    }

    @keyframes readerSlideIn {
      0%   { opacity: 0; transform: translateX(60px) scale(0.95); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes borderGlow {
      0%, 100% { border-color: var(--blue-bright); box-shadow: 0 0 8px rgba(0, 71, 224, 0.3), inset 0 0 8px rgba(0, 71, 224, 0.05); }
      50%      { border-color: var(--blue-neon); box-shadow: 0 0 20px rgba(41, 98, 255, 0.5), inset 0 0 16px rgba(41, 98, 255, 0.1); }
    }

    @keyframes textGlitchBlue {
      0%, 100% { text-shadow: 3px 3px 0 var(--blue-bright), -3px -3px 0 var(--sky-bright); }
      25%       { text-shadow: -3px 3px 0 var(--blue-neon), 3px -3px 0 var(--blue-royal); }
      50%       { text-shadow: 3px -3px 0 var(--sky-bright), -3px 3px 0 var(--blue-crimson); }
      75%       { text-shadow: -3px -3px 0 var(--blue-electric), 3px 3px 0 var(--sky-muted); }
    }

    @keyframes slideFromRight {
      0%   { transform: translateX(40px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* ═══════════════════════════════════════════
       P5 DECORATIVE DIAMONDS (blue + gold)
       ═══════════════════════════════════════════ */
    .p5-diamond {
      width: 12px; height: 12px;
      background: var(--blue-bright);
      transform: rotate(45deg);
      display: inline-block;
      flex-shrink: 0;
      animation: diamondSpin 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    .p5-diamond.small { width: 8px; height: 8px; }
    .p5-diamond.gold { background: var(--gold); }
    .p5-diamond.sky { background: var(--sky-bright); }

    /* ═══════════════════════════════════════════
       CORNER DECORATIONS
       ═══════════════════════════════════════════ */
    .corner-deco {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      opacity: 0.55;
    }
    .corner-deco.tl { top: 20px; left: 20px; }
    .corner-deco.tr { top: 20px; right: 20px; }
    .corner-deco.bl { bottom: 20px; left: 20px; }
    .corner-deco.br { bottom: 20px; right: 20px; }

    .corner-angle {
      width: 40px; height: 40px;
      border: 3px solid var(--blue-crimson);
      position: relative;
    }
    .corner-angle.tl-shape {
      border-right: none; border-bottom: none;
      animation: panelReveal 0.8s ease 0.8s forwards;
      opacity: 0;
    }
    .corner-angle.br-shape {
      border-left: none; border-top: none;
      animation: panelReveal 0.8s ease 1s forwards;
      opacity: 0;
    }
    .corner-angle.tr-shape {
      border-left: none; border-bottom: none;
      animation: panelReveal 0.8s ease 0.9s forwards;
      opacity: 0;
    }
    .corner-angle.bl-shape {
      border-right: none; border-top: none;
      animation: panelReveal 0.8s ease 1.1s forwards;
      opacity: 0;
    }

    /* ═══════════════════════════════════════════
       BLUE DRIP DECORATION (like reference blood drip)
       ═══════════════════════════════════════════ */
    .drip-container {
      position: fixed;
      top: 0;
      right: 60px;
      z-index: 5;
      pointer-events: none;
    }
    .drip {
      width: 3px;
      background: linear-gradient(to bottom, var(--blue-bright), var(--sky-bright));
      border-radius: 0 0 3px 3px;
      margin-bottom: 12px;
      animation: dripDown 2s ease-out forwards;
      opacity: 0;
    }
    .drip:nth-child(1) { animation-delay: 1.2s; height: 40px; }
    .drip:nth-child(2) { animation-delay: 1.5s; height: 25px; margin-left: 8px; }
    .drip:nth-child(3) { animation-delay: 1.8s; height: 50px; margin-left: -4px; }

    /* ═══════════════════════════════════════════
       MAIN APP LAYOUT
       ═══════════════════════════════════════════ */
    .app-layout {
      display: flex;
      gap: 0rem;
      padding: 1.5rem;
      min-height: 100vh;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    /* Open state: top-align both panels */
    .app-layout.reader-open {
      align-items: flex-start;
    }

    /* ── Left spacer: pushes content center initially, collapses on open ── */
    .layout-spacer {
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-layout:not(.reader-open) .layout-spacer {
      flex: 1;
    }
    .app-layout.reader-open .layout-spacer {
      flex: 0;
    }

    /* ── Right spacer: mirrors left spacer for perfect centering ── */
    .layout-spacer-right {
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-layout:not(.reader-open) .layout-spacer-right {
      flex: 1;
    }
    .app-layout.reader-open .layout-spacer-right {
      flex: 0;
    }

    /* ── Article list panel ── */
    .article-panel {
      width: 620px;
      max-width: 92vw;
      flex-shrink: 0;
      transition: width 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                  margin 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .app-layout.reader-open .article-panel {
      width: 380px;
      margin-right: 1.5rem;
    }

    /* ── Narrow panel: compact button internals ── */
    .app-layout.reader-open .article-btn {
      padding: 1rem 1.2rem;
    }
    .app-layout.reader-open .article-btn .art-cover-icon {
      width: 40px; height: 40px;
      font-size: 1.2rem;
    }
    .app-layout.reader-open .article-btn .art-title {
      font-size: 1.15rem;
    }
    .app-layout.reader-open .article-btn .art-excerpt {
      font-size: 0.78rem;
    }
    .app-layout.reader-open .article-btn .art-meta {
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .app-layout.reader-open .article-btn .art-date,
    .app-layout.reader-open .article-btn .art-time {
      font-size: 0.7rem;
    }
    .app-layout.reader-open .article-btn .art-tag {
      font-size: 0.65rem;
    }

    /* ── Reader panel ── */
    .reader-panel {
      flex: 0;
      width: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateX(50px);
      transition: flex 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s,
                  transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
      max-height: calc(100vh - 3rem);
      position: sticky;
      top: 1.5rem;
    }
    .app-layout.reader-open .reader-panel {
      flex: 1;
      width: auto;
      opacity: 1;
      transform: translateX(0);
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       COMIC PANEL — adapted for blue P5 aesthetic
       ═══════════════════════════════════════════ */
    .comic-panel {
      background: var(--bg-card);
      border: 3px solid var(--black-pure);
      outline: 1.5px solid var(--blue-crimson);
      outline-offset: -6px;
      padding: 2rem 1.8rem;
      position: relative;
      box-shadow:
        8px 8px 0 rgba(0,0,0,0.9),
        14px 14px 0 rgba(0, 71, 224, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .comic-panel:hover {
      transform: translate(-2px, -2px);
      box-shadow:
        10px 10px 0 rgba(0,0,0,0.9),
        18px 18px 0 rgba(0, 71, 224, 0.22);
    }

    /* Inner halftone strip at top of comic panels */
    .comic-panel::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        var(--blue-bright) 0px,
        var(--blue-bright) 4px,
        transparent 4px,
        transparent 8px
      );
      opacity: 0.45;
    }

    /* ═══════════════════════════════════════════
       HEADER — Archive title
       ═══════════════════════════════════════════ */
    .archive-header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }
    .archive-label {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: panelReveal 0.6s ease 0.1s forwards;
    }
    .archive-label .p5-diamond {
      animation-delay: 0.3s;
    }

    .archive-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 400;
      line-height: 0.9;
      color: var(--white-soft);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: panelReveal 0.7s ease 0.25s forwards;
    }
    .archive-title .title-accent {
      color: var(--blue-bright);
      position: relative;
      display: inline-block;
    }
    .archive-title .title-accent::after {
      content: '✦';
      position: absolute;
      top: -0.4em;
      right: -0.3em;
      font-size: 0.3em;
      color: var(--gold-bright);
      animation: floatUpDown 2s ease-in-out infinite;
    }

    .archive-subtitle {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--sky-muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 0.2rem;
      opacity: 0;
      animation: panelReveal 0.6s ease 0.4s forwards;
    }

    /* Blue slash divider */
    .header-slash {
      width: 0;
      height: 4px;
      background: var(--blue-bright);
      margin: 1.2rem auto;
      position: relative;
      animation: slashIn 1s ease 0.6s forwards;
    }
    .header-slash::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 0; right: 0;
      height: 12px;
      background: repeating-linear-gradient(
        90deg,
        var(--blue-crimson) 0px,
        var(--blue-crimson) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* ═══════════════════════════════════════════
       ARTICLE BUTTONS — wide, rich info
       ═══════════════════════════════════════════ */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .article-btn {
      display: block;
      width: 100%;
      background: var(--bg-card);
      border: 3px solid var(--black-pure);
      outline: 1.5px solid var(--blue-steel);
      outline-offset: -6px;
      padding: 1.3rem 1.5rem;
      position: relative;
      cursor: pointer;
      text-align: left;
      color: var(--white-soft);
      font-family: var(--font-body);
      box-shadow:
        6px 6px 0 rgba(0,0,0,0.85),
        10px 10px 0 rgba(0, 71, 224, 0.08);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }
    .article-btn::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--blue-bright) 0px,
        var(--blue-bright) 3px,
        transparent 3px,
        transparent 6px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .article-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow:
        10px 10px 0 rgba(0,0,0,0.9),
        16px 16px 0 rgba(0, 71, 224, 0.18);
      outline-color: var(--blue-bright);
      border-color: var(--blue-bright);
    }
    .article-btn:hover::before {
      opacity: 0.6;
    }
    .article-btn:active {
      transform: translate(-1px, -1px);
      box-shadow:
        4px 4px 0 rgba(0,0,0,0.85),
        8px 8px 0 rgba(0, 71, 224, 0.1);
    }

    /* Selected state */
    .article-btn.active {
      outline-color: var(--blue-neon);
      outline-width: 2px;
      border-color: var(--blue-neon);
      animation: borderGlow 2.5s ease-in-out infinite;
      box-shadow:
        6px 6px 0 rgba(0,0,0,0.9),
        10px 10px 0 rgba(41, 98, 255, 0.2);
    }
    .article-btn.active::before {
      opacity: 0.7;
      background: repeating-linear-gradient(
        90deg,
        var(--blue-neon) 0px,
        var(--blue-neon) 3px,
        transparent 3px,
        transparent 6px
      );
    }

    /* Article button inner layout */
    .article-btn .art-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .article-btn .art-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--sky-muted);
      letter-spacing: 0.06em;
      background: rgba(0, 71, 224, 0.12);
      padding: 0.15em 0.6em;
      border-radius: 3px;
    }
    .article-btn .art-time {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--gold);
      letter-spacing: 0.04em;
    }
    .article-btn .art-tag {
      font-family: var(--font-accent);
      font-size: 0.7rem;
      color: var(--sky-soft);
      background: rgba(91, 158, 255, 0.1);
      padding: 0.15em 0.55em;
      border-radius: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .article-btn .art-cover-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .article-btn .art-cover-icon {
      width: 52px; height: 52px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue-deep), var(--blue-steel));
      border: 2px solid var(--blue-crimson);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transform: rotate(0deg);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .article-btn:hover .art-cover-icon {
      transform: rotate(-3deg) scale(1.05);
      border-color: var(--blue-bright);
    }
    /* Halftone dot in corner of cover */
    .article-btn .art-cover-icon::after {
      content: '';
      position: absolute;
      bottom: 3px; right: 3px;
      width: 12px; height: 12px;
      background: radial-gradient(circle, var(--blue-bright) 2px, transparent 2px);
      background-size: 6px 6px;
      opacity: 0.5;
    }

    .article-btn .art-info {
      flex: 1;
      min-width: 0;
    }
    .article-btn .art-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.04em;

それは何の変哲もない一日だった。**歪んだ欲望**が渦巻くこの街で、俺たちはただの学生に過ぎなかった。

  /* ═══════════════════════════════════════════════════════════
     APPLICATION STATE
     ═══════════════════════════════════════════════════════════ */
  const state = {
    articles: [],
    activeArticleId: null,
    isReaderOpen: false,
    entranceComplete: false,   // true after all CSS entrance animations finish
    scrollTicking: false,
  };

  /* ═══════════════════════════════════════════════════════════
     API / DATA LAYER — Swappable with real API calls
     ═══════════════════════════════════════════════════════════ */
  async function fetchArticles() {
    if (CONFIG.USE_API) {
      // ── RESERVED: Replace with real API call ──
      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}${CONFIG.ENDPOINTS.articles}`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn('[PhantomArchive] API unavailable, using static data:', err.message);
        // Fallback to static data
      }
    }
    // Return static data (with slight delay to simulate network for animation feel)
    return new Promise(resolve => {
      setTimeout(() => resolve([...STATIC_ARTICLES]), 200);
    });
  }

  async function fetchArticleById(id) {
    if (CONFIG.USE_API) {
      try {
        const url = `${CONFIG.API_BASE_URL}${CONFIG.ENDPOINTS.articleById.replace(':id', id)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn('[PhantomArchive] API unavailable for article:', err.message);
      }
    }
    return STATIC_ARTICLES.find(a => a.id === id) || null;
  }

  /* ═══════════════════════════════════════════════════════════
     RENDER ARTICLE BUTTONS
     ═══════════════════════════════════════════════════════════ */
  function renderArticleButtons(articles) {
    const listEl = document.getElementById('articleList');
    const countEl = document.getElementById('articleCount');

    listEl.innerHTML = articles.map((art, i) => `
      <button class="article-btn" data-id="${art.id}" data-index="${i}"
              style="animation-delay: ${0.5 + i * 0.1}s;"
              aria-label="Open article: ${art.title}">
        <div class="art-meta">
          <span class="art-date">${art.date}</span>
          <span class="art-time">${art.time}</span>
          ${art.tags.map(t => `<span class="art-tag">#${t}</span>`).join('')}
        </div>
        <div class="art-cover-row">
          <div class="art-cover-icon">${art.cover}</div>
          <div class="art-info">
            <div class="art-title">${art.title}</div>
            <div class="art-excerpt">${art.excerpt}</div>
          </div>
        </div>
        <span class="art-arrow">▶</span>
      </button>
    `).join('');

    countEl.textContent = `${articles.length} MISSIONS AVAILABLE`;

    // Attach click handlers
    listEl.querySelectorAll('.article-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        openArticle(id);
      });
    });
  }

  /* ═══════════════════════════════════════════════════════════
     OPEN ARTICLE — Trigger layout transition + load content
     ═══════════════════════════════════════════════════════════ */
  async function openArticle(id) {
    const article = await fetchArticleById(id);
    if (!article) return;

    state.activeArticleId = id;

    // Switch layout
    const appLayout = document.getElementById('appLayout');

    if (!state.isReaderOpen) {
      // First time: animate the layout transition
      state.isReaderOpen = true;
      appLayout.classList.add('reader-open');

      // ── Set ALL buttons to fully visible (not cleared to '') ──
      // Clearing would fall back to CSS opacity:0 (entrance animation start state)
      document.querySelectorAll('.article-btn').forEach(btn => {
        btn.style.opacity = '1';
        btn.style.transform = 'none';
      });

      // After layout transition completes, load content with staggered animation
      setTimeout(() => {
        renderReaderContent(article);
      }, 350);
    } else {
      // Already open: just switch content with animation
      renderReaderContent(article);
    }

    // Highlight active button
    document.querySelectorAll('.article-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-id') === id);
    });

    // Scroll reader to top
    const readerPanel = document.getElementById('readerPanel');
    if (readerPanel) readerPanel.scrollTop = 0;
  }

  /* ═══════════════════════════════════════════════════════════
     CLOSE READER — Return to centered list view
     ═══════════════════════════════════════════════════════════ */
  function closeReader() {
    const appLayout = document.getElementById('appLayout');
    state.isReaderOpen = false;
    state.activeArticleId = null;

    // ── Set all buttons to visible (NOT cleared to '') ──
    // Empty string falls back to CSS opacity:0 from entrance animation
    document.querySelectorAll('.article-btn').forEach(btn => {
      btn.classList.remove('active');
      btn.style.opacity = '1';
      btn.style.transform = 'none';
    });

    appLayout.classList.remove('reader-open');

    // Reset reader content after transition
    setTimeout(() => {
      const mdContent = document.getElementById('mdContent');
      const readerHeader = document.getElementById('readerHeader');
      mdContent.innerHTML = `
        <div class="reader-empty">
          <div class="empty-diamond"></div>
          <p class="empty-text">Select a mission<br>to begin reading</p>
        </div>
      `;
      readerHeader.style.display = 'none';

      // Re-run scroll handler to recalc button visibility after layout restores
      updateScrollEffects();
    }, 600);
  }

  /* ═══════════════════════════════════════════════════════════
     RENDER MARKDOWN CONTENT IN READER
     ═══════════════════════════════════════════════════════════ */
  function renderReaderContent(article) {
    const mdContent = document.getElementById('mdContent');
    const readerHeader = document.getElementById('readerHeader');
    const rhDate = document.getElementById('rhDate');
    const rhTag = document.getElementById('rhTag');
    const rhTitle = document.getElementById('rhTitle');

    // Update header
    rhDate.textContent = `${article.date} · ${article.time}`;
    rhTag.textContent = article.tags.map(t => `#${t}`).join(' ');
    rhTitle.textContent = article.title;
    readerHeader.style.display = 'block';

    // Render markdown
    let html;
    if (typeof marked !== 'undefined') {
      // Configure marked for safe rendering
      marked.setOptions({
        breaks: true,
        gfm: true,
      });
      html = marked.parse(article.content);
    } else {
      // Fallback: basic HTML escape + line break conversion
      html = article.content
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
      html = `<p>${html}</p>`;
    }

    mdContent.innerHTML = html;
    mdContent.classList.remove('reader-open-anim');
    void mdContent.offsetWidth; // Force reflow
    mdContent.classList.add('reader-open-anim');
    mdContent.style.opacity = '1';
  }

  /* ═══════════════════════════════════════════════════════════
     SCROLL-DRIVEN FADE IN/OUT (continuous, like reference)
     Only active AFTER CSS entrance animations finish, and only
     when the reader is closed. Inline styles are cleared on
     reader open/close to prevent conflicts.
     ═══════════════════════════════════════════════════════════ */
  function updateScrollEffects() {
    const vh = window.innerHeight;
    // Only apply when reader is closed AND entrance animations are done
    if (state.isReaderOpen || !state.entranceComplete) return;

    const buttons = document.querySelectorAll('.article-btn');
    buttons.forEach(btn => {
      const rect = btn.getBoundingClientRect();
      const center = (rect.top + rect.bottom) / 2;
      const ratio = center / vh;

      let opacity;
      if (ratio < 0.2) {
        opacity = 0;
      } else if (ratio < 0.35) {
        opacity = (ratio - 0.2) / 0.15;
      } else if (ratio < 0.65) {
        opacity = 1;
      } else if (ratio < 0.8) {
        opacity = 1 - (ratio - 0.65) / 0.15;
      } else {
        opacity = 0;
      }
      opacity = Math.max(0, Math.min(1, opacity));

      const translateY = (1 - opacity) * 40;
      const scale = 0.93 + opacity * 0.07;

      btn.style.opacity = opacity;
      btn.style.transform = `translateY(${translateY}px) scale(${scale})`;
    });
    state.scrollTicking = false;
  }

  function onScroll() {
    if (!state.scrollTicking) {
      requestAnimationFrame(updateScrollEffects);
      state.scrollTicking = true;
    }
  }

  function initScrollAnimations() {
    // ── DO NOT run scroll effects immediately on page load ──
    // Wait for all CSS entrance animations to complete.
    // Max animation-delay: 0.5 + (N-1)*0.1 = 1.3s for 9 articles, + 0.5s duration = 1.8s.
    // We add a 200ms buffer → 2.0s.
    setTimeout(() => {
      state.entranceComplete = true;
      // Strip CSS animations so scroll handler's inline styles can take effect.
      // (animation-fill-mode:forwards values override inline styles per CSS cascade)
      document.querySelectorAll('.article-btn').forEach(btn => {
        btn.style.animation = 'none';
        btn.style.opacity = '1';
        btn.style.transform = 'none';
      });
      // Initial scroll-effect run — only if reader is still closed
      if (!state.isReaderOpen) {
        updateScrollEffects();
      }
    }, 2000);

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
  }

  /* ═══════════════════════════════════════════════════════════
     CLICK SPARKLE EFFECT (blue version)
     ═══════════════════════════════════════════════════════════ */
  function initSparkleEffect() {
    document.addEventListener('click', function(e) {
      const spark = document.createElement('div');
      const size = Math.random() * 8 + 4;
      const hue = Math.random() > 0.5 ? '0, 71, 224' : '91, 158, 255';
      spark.style.cssText = `
        position: fixed;
        left: ${e.clientX - size/2}px;
        top: ${e.clientY - size/2}px;
        width: ${size}px;
        height: ${size}px;
        background: radial-gradient(circle, rgb(${hue}), rgba(${hue}, 0.4));
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
        animation: sparkFade 0.6s ease-out forwards;
      `;
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    });

    const sparkStyle = document.createElement('style');
    sparkStyle.textContent = `
      @keyframes sparkFade {
        0%   { transform: scale(1); opacity: 1; }
        100% { transform: scale(3); opacity: 0; }
      }
    `;
    document.head.appendChild(sparkStyle);
  }

  /* ═══════════════════════════════════════════════════════════
     KEYBOARD SHORTCUTS
     ═══════════════════════════════════════════════════════════ */
  function initKeyboardShortcuts() {
    document.addEventListener('keydown', function(e) {
      // Escape to close reader
      if (e.key === 'Escape' && state.isReaderOpen) {
        closeReader();
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════
     INITIALIZATION
     ═══════════════════════════════════════════════════════════ */
  async function init() {
    // Load articles
    state.articles = await fetchArticles();
    renderArticleButtons(state.articles);

    // Set up back button
    document.getElementById('readerBack').addEventListener('click', closeReader);

    // Initialize effects
    initScrollAnimations();
    initSparkleEffect();
    initKeyboardShortcuts();

    // Log config (reserved port info)
    console.log(
      `%c◆ Phantom Archive ◆%c\nAPI endpoint reserved at: %c${CONFIG.API_BASE_URL}%c\nSet CONFIG.USE_API = true to enable backend integration.`,
      'color: #0047E0; font-family: "Bebas Neue", sans-serif; font-size: 1.2em;',
      '',
      'color: #ffc107;',
      ''
    );
  }

  // Boot
  init().catch(console.error);
  </script>
